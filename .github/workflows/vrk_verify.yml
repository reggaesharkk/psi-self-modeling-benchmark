name: VRK v5.0 Source-Free Replay Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-vrk-certificate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Source-Free Standard-Library VRK Replay Verifier
        run: python3 verify_psi_vrk_replay.py vrk_dgp_verification/colab_psi_benchmark_vrk_bundle.json
